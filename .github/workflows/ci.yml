name: BYBE Studio check, test and build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - name: Verify optional Python ASR worker syntax
        run: python3 -m py_compile scripts/local_asr_worker.py
      - name: Ensure FFmpeg is available
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Real media API smoke test
        run: node tests/media-smoke.mjs
